[workspace]
resolver = "2"
members = ["crates/*", "apps/fellor-app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/shzFas/fellor_file"
authors = ["shzFas and Fellor File contributors"]
rust-version = "1.85"

[workspace.dependencies]
# internal
fellor-vfs = { path = "crates/fellor-vfs" }
fellor-local = { path = "crates/fellor-local" }
fellor-usbmux = { path = "crates/fellor-usbmux" }
fellor-lockdown = { path = "crates/fellor-lockdown" }
fellor-afc = { path = "crates/fellor-afc" }
fellor-ios = { path = "crates/fellor-ios" }
fellor-ptp = { path = "crates/fellor-ptp" }
fellor-mtp = { path = "crates/fellor-mtp" }
fellor-transfer = { path = "crates/fellor-transfer" }
fellor-index = { path = "crates/fellor-index" }
fellor-devices = { path = "crates/fellor-devices" }
# external (infrastructure only — protocol code is ours)
tokio = { version = "1.54", features = ["full"] }
tokio-util = "0.7"
futures = "0.3"
async-trait = "0.1"
bytes = "1.12"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
plist = "1.10"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pki-types = "1"
nusb = "0.2"
rusqlite = { version = "0.41", features = ["bundled"] }
clap = { version = "4.6", features = ["derive"] }
eframe = "0.37"
egui = "0.37"
egui_extras = "0.37"
rfd = "0.17"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
uuid = { version = "1", features = ["v4"] }
tempfile = "3"
dirs = "6"
chrono = "0.4"
libc = "0.2"
